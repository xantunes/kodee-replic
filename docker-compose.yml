version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: kodee_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/kodee
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - db
      - redis
      - qdrant
    networks:
      - kodee_network
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: kodee_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kodee
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - kodee_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kodee_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kodee_network
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: kodee_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - kodee_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: kodee_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - app
    networks:
      - kodee_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  grafana_data:

networks:
  kodee_network:
    driver: bridge
